# Independent local test stack: docker compose -f compose.minio.yaml up --build
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-test-key
      MINIO_ROOT_PASSWORD: local-test-secret-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 local-test-key local-test-secret-only; do sleep 1; done
        mc mb --ignore-existing local/flash
  flash:
    build: .
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PUBLIC_URL: http://localhost:3000
      ADMIN_PASSWORD: "123456"
      S3_ENDPOINT: http://host.docker.internal:9000
      S3_REGION: us-east-1
      S3_BUCKET: flash
      S3_ACCESS_KEY: local-test-key
      S3_SECRET_KEY: local-test-secret-only
      TRUST_PROXY_HOPS: 0
    ports: ["3000:3000"]
    volumes: [flash-data:/app/data]
    mem_limit: 768m
    cpus: 1
volumes:
  minio-data:
  flash-data:
